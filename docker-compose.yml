version: '3.8'

services:
  fraud-detection-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudguard_ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/metadata"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
